name: precompute

on:
  schedule:
    # Daily at 08:00 UTC, after the 06:00 ingestion run
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: precompute
  cancel-in-progress: false

jobs:
  precompute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            scoring/requirements.txt
            requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Load the environment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_KEY=$SUPABASE_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Build the normalized decision matrix
        run: python -m scoring.precompute_matrix

      - name: Publish the matrix
        run: python -m scoring.precompute_matrix --persist
